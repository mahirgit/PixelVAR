run_name: var_sprites_patchvq16_debug1k
seed: 42
output_dir: outputs/runs
checkpoint_dir: checkpoints
checkpoint_monitor: val/loss
log_lr: true
matmul_precision: high

data:
  processed_dir: data/processed/sprites_patchvq16
  batch_size: 256
  num_workers: 2
  scale_resolutions: [1, 2, 4, 8, 16]
  max_train_samples: 1000
  max_val_samples: 256
  return_rgb: false

model:
  vocab_size: 512
  scale_resolutions: [1, 2, 4, 8, 16]
  d_model: 256
  n_layers: 6
  n_heads: 8
  mlp_dim: 1024
  dropout: 0.1

optimizer:
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.95]
  scheduler: cosine

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  max_epochs: 100
  log_every_n_steps: 5
  gradient_clip_val: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 1

logger:
  name: csv
