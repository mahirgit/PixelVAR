run_name: vqvae_sprites_debug1k
seed: 42
output_dir: outputs/runs
checkpoint_dir: checkpoints
checkpoint_monitor: val/loss
log_lr: true
matmul_precision: high

data:
  processed_dir: data/processed/sprites
  image_array: originals_rgba.npy
  batch_size: 256
  num_workers: 2
  max_train_samples: 1000
  max_val_samples: 256

model:
  in_channels: 4
  hidden_channels: 128
  embedding_dim: 64
  num_codes: 512
  latent_size: 16
  commitment_weight: 0.25
  residual_blocks: 2

loss:
  opaque_rgb_weight: 1.0
  transparent_rgb_weight: 0.05
  alpha_weight: 1.0
  code_entropy_weight: 0.02

optimizer:
  lr: 0.0002
  weight_decay: 0.01
  betas: [0.9, 0.95]
  scheduler: cosine

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  max_epochs: 50
  log_every_n_steps: 5
  gradient_clip_val: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 1

logger:
  name: csv
