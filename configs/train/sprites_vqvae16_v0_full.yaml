run_name: var_sprites_vqvae16_v0_full
seed: 42
output_dir: outputs/runs
checkpoint_dir: checkpoints
checkpoint_monitor: val/loss
log_lr: true
matmul_precision: high

early_stopping:
  monitor: val/loss
  mode: min
  patience: 8
  min_delta: 0.001

data:
  processed_dir: data/processed/sprites_vqvae16
  batch_size: 512
  num_workers: 4
  scale_resolutions: [1, 2, 4, 8, 16]
  max_train_samples:
  max_val_samples:
  return_rgb: false

model:
  vocab_size: 512
  scale_resolutions: [1, 2, 4, 8, 16]
  d_model: 256
  n_layers: 6
  n_heads: 8
  mlp_dim: 1024
  dropout: 0.1

optimizer:
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.95]
  scheduler: cosine

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  max_epochs: 80
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 1

logger:
  name: csv
